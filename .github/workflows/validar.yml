name: Validar Conecta Cultura

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    name: Pruebas, cobertura y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias y regenerar el lockfile si está dañado
        run: |
          npm install || {
            echo "La instalación falló con el lockfile actual; se intentará regenerarlo desde package.json."
            rm -f package-lock.json
            npm install
          }

      - name: Registrar el lockfile sincronizado en main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "El lockfile ya está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock.json"
          git push

      - name: Ejecutar pruebas automatizadas
        run: npm run test:run

      - name: Generar informe de cobertura
        run: npm run coverage

      - name: Revisar estilo y posibles errores
        run: npm run lint

      - name: Construir para producción
        run: npm run build

      - name: Publicar el informe HTML de cobertura como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-cobertura
          path: coverage/index.html
          if-no-files-found: error
          retention-days: 14
