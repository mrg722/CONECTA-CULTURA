name: Validar Conecta Cultura

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validar:
    name: Pruebas, cobertura y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias y regenerar el lockfile si está dañado
        run: |
          npm install || {
            echo "La instalación falló con el lockfile actual; se intentará regenerarlo desde package.json."
            rm -f package-lock.json
            npm install
          }
          npm audit fix || echo "La auditoría sigue mostrando avisos; se documentarán para revisión manual."

      - name: Registrar el lockfile sincronizado en main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "El lockfile ya está sincronizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sincronizar package-lock.json"
          git push

      - name: Diagnosticar vulnerabilidades de dependencias
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require("node:fs");
          try {
            const reporte = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Resumen de npm audit:", JSON.stringify(reporte.metadata?.vulnerabilities || {}));
            for (const [paquete, dato] of Object.entries(reporte.vulnerabilities || {})) {
              const avisos = dato.via.map((aviso) =>
                typeof aviso === "string"
                  ? aviso
                  : { titulo: aviso.title, url: aviso.url, rango: aviso.range }
              );
              console.log(JSON.stringify({
                paquete,
                severidad: dato.severity,
                dependenciaDirecta: dato.isDirect,
                avisos,
                correccionDisponible: dato.fixAvailable
              }));
            }
          } catch (error) {
            console.log("No se pudo interpretar el informe de npm audit:", error.message);
          }
          NODE

      - name: Ejecutar pruebas automatizadas
        run: npm run test:run

      - name: Generar informe de cobertura
        run: npm run coverage

      - name: Revisar estilo y posibles errores
        run: npm run lint

      - name: Construir para producción
        run: npm run build

      - name: Publicar el informe HTML de cobertura como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: informe-cobertura
          path: coverage/index.html
          if-no-files-found: error
          retention-days: 14

      - name: Publicar el reporte de seguridad de dependencias
        uses: actions/upload-artifact@v7
        with:
          name: auditoria-dependencias
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14
