# Configuración exclusiva de las pruebas: ./mvnw test no debe exigir un MySQL
# levantado ni la variable JWT_SECRET del entorno de ejecución.
spring.datasource.url=jdbc:h2:mem:conecta_cultura_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=secreto-solo-para-pruebas-de-al-menos-32-caracteres
app.jwt.expiration-ms=3600000

app.seed.admin-password=
app.seed.user-password=
