spring.application.name=conecta-cultura-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conecta_cultura?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:conecta_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.user-username=${USER_USERNAME:usuario}
app.seed.user-password=${USER_PASSWORD:}
