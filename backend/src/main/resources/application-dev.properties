# Perfil de desarrollo: base H2 en memoria para probar el CRUD sin instalar MySQL.
# Se activa con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:conecta_cultura;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
